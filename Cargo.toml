[package]
name = "visual_key_switcher"
version = "1.0.0"
edition = "2021"
description = "Visual/audio keyboard layout switch indicator with custom hotkeys"
build = "build.rs"

[[bin]]
name = "VisualKeySwitcher"
path = "src/main.rs"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
panic = "abort"
strip = true
