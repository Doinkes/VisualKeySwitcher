name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/VisualKeySwitcher.exe dist/
          Copy-Item sound_pack dist/sound_pack -Recurse
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath VisualKeySwitcher-win64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VisualKeySwitcher-win64
          path: VisualKeySwitcher-win64.zip
